# keepmum default L1 rules (gitleaks-style).
#
# Each [[rule]] is a regex. `group` selects the capture group that holds the secret
# (0 = whole match). `keywords` is a cheap case-insensitive prefilter: the regex only
# runs when one keyword occurs in the text. `confidence` is reported with each span.
#
# `prose_guard = true` drops a lowercase-word value that a sentence continues after.
# `min_classes` drops a value that uses fewer of lowercase, uppercase, digits and other
# characters: a word, not a secret.
# `filters` picks which [filters] drop a captured value: "placeholder" (stopwords,
# placeholder words, repeated characters; the default), "all" (also references to values
# held elsewhere, and plain numbers; for rules keyed on a variable name), "prose" (also
# identifiers such as snake_case names; for rules keyed on a word in a sentence), or false.
#
# `type` is SECRET unless set. Rules of other types (personal data) apply only with
# `pii = true`, and their spans pass the same noise checks as the model's.

[allowlist]
# Exact strings that are never redacted: documented example credentials and test cards.
strings = [
  "AKIAIOSFODNN7EXAMPLE",
  "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c",
  "4242424242424242", "4242 4242 4242 4242",
  "4111111111111111", "4111 1111 1111 1111",
]
# Full-match regexes. keepmum's own placeholders must never be re-redacted.
patterns = [
  '''KEEPMUM_[A-Z]+_[0-9a-f]{8,12}''',
  # Stripe publishable keys are public by design.
  '''pk_(?:test|live)_[A-Za-z0-9]{10,247}''',
  # Claude Code's own vocabulary: the model reads product names as people.
  '''(?:Claude|Anthropic)(?: Code| Opus| Sonnet| Haiku| Fable)?(?: [0-9.]+)?''',
]

[filters]
# Regexes searched in a captured value. Any match drops the value.
stopwords = '''(?i)^(?:true|false|null|none|nil|undefined|required|optional|string|str|bool|boolean|int|integer|number|object|any|bearer|basic|password|passwd|pass|pwd|secret|secrets|token|changeme|example|sample|dummy|test|testing|placeholder|redacted|hidden|masked|todo|tbd|fixme|n/?a|\*+|x{3,}|\.{3,})$'''
placeholder = '''(?i)^(?:my[_-]|insert[_-]|replace[_-]|enter[_-]|sample|dummy|fake|<|\{\{|\[\[)|(?:^|[_-])your[_-]|example|placeholder|redacted|(?:\.{3}|…)$'''
# References to a value held elsewhere: env vars, template variables, attribute access, calls.
reference = '''^(?:\$|%\(|%[A-Z_]+%|process\.env|os\.(?:environ|getenv)|getenv|ENV\[|env\(|secrets\.|vault:|ref\+|!Ref|!Sub|self\.|this\.|config\.|settings\.)|\$\{|^[\w.]+[(\[]|^[A-Za-z_]\w{0,30}(?:\.[A-Za-z_]\w{0,30})+$|^[A-Z][A-Z0-9]*_[A-Z0-9_]+$|^[a-z]+(?:[-_.][a-z]+)+$|^[a-z][a-z0-9+.-]*://|^(?:\.{0,2}/|~/)'''
numeric = '''^[\d.:_-]+$'''
# Identifiers: snake_case, kebab-case, dotted and camelCase names (only with filters = "prose").
identifier = '''^[a-z][a-z0-9]*(?:[-_.][a-z0-9]+)+$|^[a-z]+(?:[A-Z][a-z0-9]+)+$'''
# Public by design: an Ethereum-style address (0x + 40 hex). A 64-hex private key still matches.
public = '''^0x[0-9a-fA-F]{40}$'''
# A run of six identical characters (xxxxxx, 000000, ******) marks a placeholder.
repeated = '''(.)\1{5}'''

[entropy]
# High-entropy strings with no provider prefix. Low confidence, but still redacted.
enabled = true
min_len = 20
max_len = 256
# Shannon entropy as a fraction of the maximum possible for the string's length.
min_ratio = 0.88
confidence = 0.5
# Skip candidates preceded by these markers (hashes, digests, inline data).
skip_before = '''(?i)(?:sha(?:1|224|256|384|512)[-:=]|md5[-:=]|integrity|checksum|digest|h1:|base64,|oid |nonce|@sha256:|ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp\d+)\s*["']?$'''

[luhn]
enabled = true
confidence = 0.9

[iban]
enabled = true
confidence = 0.9

# --- Private keys and tokens with a fixed structure ------------------------------

[[rule]]
id = "private-key"
regex = '''-----BEGIN[A-Z0-9 ]{0,40}PRIVATE KEY(?: BLOCK)?-----[\s\S]{16,}?-----END[A-Z0-9 ]{0,40}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key"]
filters = false

[[rule]]
id = "jwt"
regex = '''\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''
keywords = ["eyj"]

# --- Provider keys ---------------------------------------------------------------

[[rule]]
id = "aws-access-key-id"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
group = 1
keywords = ["akia", "asia", "abia", "acca", "a3t"]

[[rule]]
id = "aws-secret-access-key"
regex = '''(?i)aws[\w.-]{0,30}?(?:secret|sk)[\w.-]{0,20}["']?\s*[:=]\s*["']?([A-Za-z0-9/+]{40})(?![A-Za-z0-9/+])'''
group = 1
keywords = ["aws"]

[[rule]]
id = "github-token"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'''
group = 1
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rule]]
