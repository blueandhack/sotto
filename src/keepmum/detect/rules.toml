# --- Credentials in context ------------------------------------------------------

[[rule]]
id = "connection-string-password"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]{1,20}://[^\s:/@"'<>]*:([^\s@/"'<>]{3,})@[^\s"'<>]+'''
group = 1
keywords = ["://"]
filters = "all"

[[rule]]
id = "authorization-header"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?(?:bearer|basic|token|bot)\s+([A-Za-z0-9._~+/=-]{12,})'''
group = 1
keywords = ["authorization"]
filters = "all"

[[rule]]
id = "bearer-token"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._~+/-]{20,}=*)'''
group = 1
keywords = ["bearer"]
filters = "all"

[[rule]]
id = "xml-secret-element"
regex = '''(?i)<((?:\w+[_-])?(?:password|passwd|pwd|secret|api[_-]?key|token|client[_-]?secret))>([^<\s]{6,200})</\1>'''
group = 2
keywords = ["pass", "pwd", "secret", "key>", "token"]
filters = "all"

[[rule]]
id = "kubernetes-secret-data"
# Values under data: in a kind: Secret manifest are base64-encoded secrets.
regex = '''(?m)^[ \t]+[\w.-]+:[ \t]+([A-Za-z0-9+/]{12,}={0,2})[ \t]*$'''
group = 1
keywords = ["kind: secret"]
filters = "all"

[[rule]]
id = "secret-assignment"
regex = '''(?i)[\w.-]*?(?:passw(?:or)?d|pwd|passphrase|secret|token|api[_.-]?key|apikey|access[_.-]?key|auth[_.-]?key|private[_.-]?key|client[_.-]?secret|credentials?)[\w.-]*["']?[ \t]*(?:=|:=|=>|:)[ \t]*["'`]?([^\s"'`,;]{6,200})'''
group = 1
keywords = ["pass", "pwd", "secret", "token", "key", "credential"]
filters = "all"
confidence = 0.8
# Prose, not an assignment: "set TOKEN= followed by the value" (a lowercase word, then more words).
prose_guard = true

[[rule]]
id = "secret-flag"
# A command-line flag named for a secret: --token VALUE, --api-key=VALUE, --password VALUE.
regex = '''(?i)(?<![\w-])--?(?:[a-z0-9]+[-_])*(?:passw(?:or)?d|pass|pwd|passphrase|token|secret|api[-_]?key|apikey|access[-_]?key|secret[-_]?key|auth|auth[-_]?token|private[-_]?key|client[-_]?secret|credentials?)(?:=|[ \t]+)(?!-)["']?([^\s"'`;|&<>]{8,200})'''
group = 1
keywords = ["pass", "pwd", "token", "secret", "key", "auth", "credential"]
filters = "all"
min_classes = 2
confidence = 0.8

[[rule]]
id = "curl-user-password"
# curl -u user:password
regex = '''\bcurl\b[^\n]*?[ \t](?:-u|--user)[ \t]+["']?[^\s:"']+:([^\s"'@]{6,200})'''
group = 1
keywords = ["curl"]
filters = "all"

[[rule]]
id = "password-in-prose"
# "the password for the build box is X"
regex = '''(?i)\b(?:password|passphrase|passcode)\b(?:[ \t]+(?:for|of|on|to)[ \t]+(?:the[ \t]+|my[ \t]+|our[ \t]+|your[ \t]+)?[\w.-]+(?:[ \t]+[\w.-]+)?)?[ \t]+(?:is|was)[ \t]*:?[ \t]*["'`]?([^\s"'`,;]{7,199}[^\s"'`,;.!?:)])'''
group = 1
keywords = ["password", "passphrase", "passcode"]
filters = "all"
min_classes = 2
confidence = 0.7

[[rule]]
id = "key-in-prose"
# "the Datadog key for staging is X". Not a database, cache or experiment key.
regex = '''(?i)(?<!cache )(?<!primary )(?<!foreign )(?<!sort )(?<!partition )(?<!idempotency )(?<!object )(?<!public )(?<!license )(?<!experiment )(?<!flag )(?<!lookup )(?<!composite )(?<!unique )(?<!hash )(?<!map )(?<!row )\b(?:api[ _-]?key|access[ _-]?key|secret[ _-]?key|key|token|secret)\b(?:[ \t]+(?:for|of|on|to)[ \t]+(?:the[ \t]+|my[ \t]+|our[ \t]+|your[ \t]+)?[\w.-]+(?:[ \t]+[\w.-]+)?)?[ \t]+(?:is|was)[ \t]*:?[ \t]*["'`]?([A-Za-z0-9+/_~=.-]{15,199}[A-Za-z0-9+/_~=-])'''
group = 1
keywords = ["key", "token", "secret"]
filters = "prose"
min_classes = 2
confidence = 0.7

[[rule]]
id = "netrc-password"
regex = '''(?i)\bmachine[ \t]+\S+(?:\s+login[ \t]+\S+)?\s+password[ \t]+(\S{4,200})'''
group = 1
keywords = ["machine"]
filters = "all"

[[rule]]
id = "docker-config-auth"
# ~/.docker/config.json: "auth" is base64 of user:password.
regex = '''"auth"\s*:\s*"([A-Za-z0-9+/]{12,}={0,2})"'''
group = 1
keywords = ['"auths"']

[[rule]]
id = "npmrc-auth"
regex = '''(?m)(?:^|:)_auth[ \t]*=[ \t]*["']?([A-Za-z0-9+/]{12,}={0,2})'''
group = 1
keywords = ["_auth"]

[[rule]]
id = "kubeconfig-client-key"
regex = '''(?i)\bclient-key-data:[ \t]*["']?([A-Za-z0-9+/]{40,}={0,2})'''
group = 1
keywords = ["client-key-data"]

[[rule]]
id = "azure-storage-key"
regex = '''(?i)\b(?:AccountKey|SharedAccessKey)=([A-Za-z0-9+/]{40,88}={0,2})'''
group = 1
keywords = ["accountkey", "sharedaccesskey"]

[[rule]]
id = "signed-url-signature"
# Presigned S3 and GCS URLs, Azure SAS tokens: the signature grants access.
regex = '''(?i)[?&](?:X-Amz-Signature|X-Amz-Security-Token|X-Goog-Signature|sig)=([A-Za-z0-9%+/=_-]{30,})'''
group = 1
keywords = ["x-amz-signature", "x-amz-security-token", "x-goog-signature", "sig="]

[[rule]]
id = "session-cookie"
regex = '''(?i)(?:\bcookie:[ \t]*|;[ \t]*)(?:__(?:Host|Secure)-)?[\w.-]*?(?:session|sess|sid|auth|token|jwt|remember)[\w.-]*=([^;\s"']{16,4096})'''
group = 1
keywords = ["cookie"]
filters = "all"

# --- Personal data (pii = true) -----------------------------------------------------
# Found without the model. The model finds names, addresses and personal URLs too.

[[rule]]
id = "email"
# Where an address starts: after a space, a quote, a bracket, `=`, `,` or `mailto:`. Not
# git@host:repo, user:password@host, icon@2x.png, x@self.weight, or a package@version.
regex = '''(?:(?<=mailto:)|(?<![^\s<>("'`,;=\[{|*]))([A-Za-z0-9][A-Za-z0-9._%+-]{0,63}@(?!self\.|this\.|cls\.)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?!(?:png|jpe?g|gif|svg|webp|ico|pdf|m?js|cjs|tsx?|jsx|json|css|scss|html?|lock|toml|ya?ml|xml|txt|log|zip|t?gz)\b)[A-Za-z]{2,24})\b(?![:@][\w/~]|\.[A-Za-z0-9-])'''
group = 1
keywords = ["@"]
type = "EMAIL"
confidence = 0.95

[[rule]]
id = "phone-nanp"
# (415) 555-2671, 415-555-2671, +1 415 555 2671: grouped, as people write them.
regex = '''(?<![\w.+/-])((?:\+1[ .-]?)?(?:\([2-9]\d{2}\)[ ]?|[2-9]\d{2}[ .-])[2-9]\d{2}[ .-]\d{4})(?![\w.-]|:\d)'''
group = 1
type = "PHONE"
confidence = 0.85

[[rule]]
id = "phone-international"
# +44 7700 900123, +49 30 1234567, +33 6 12 34 56 78
regex = '''(?<![\w.+/-])(\+[2-9]\d{0,2}(?:[ .-]?\(?\d{1,4}\)?){1,2}(?:[ .-]?\d{2,4}){2,4})(?![\w.-]|:\d)'''
group = 1
keywords = ["+"]
type = "PHONE"
confidence = 0.85

[[rule]]
id = "phone-labeled"
regex = '''(?i)\b(?:phone|tel|telephone|mobile|cell|whatsapp|sms|fax)(?:[ _-]?(?:number|no))?["']?[ \t]*[:=][ \t]*["']?(\+?\d{10,15})(?!\d)'''
group = 1
keywords = ["phone", "tel", "mobile", "cell", "whatsapp", "sms", "fax"]
type = "PHONE"
confidence = 0.9

[[rule]]
id = "us-ssn"
regex = '''(?i)\b(?:ssn|social[ _-]security(?:[ _-](?:number|no\.?))?|soc[ .]sec[ .]?(?:no\.?)?)\b[\w \t#.:="']{0,20}?\b((?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4})\b'''
group = 1
keywords = ["ssn", "social", "soc"]
type = "ACCOUNT"
confidence = 0.95

[[rule]]
id = "date-of-birth"
regex = '''(?i)(?<![a-z])(?:born(?:[ \t]+on)?|birth[ _-]?date|date[ _-]of[ _-]birth|birthday|dob|d\.o\.b\.?)["']?[ \t]*[:=]?[ \t]*["']?((?:19|20)\d{2}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/(?:19|20)?\d{2}|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?[ \t]+\d{1,2}(?:st|nd|rd|th)?,?[ \t]+(?:19|20)\d{2}|\d{1,2}[ \t]+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?[ \t]+(?:19|20)\d{2})(?![\d-])'''
group = 1
keywords = ["born", "birth", "dob", "d.o.b"]
type = "DATE"
confidence = 0.9
